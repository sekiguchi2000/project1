<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2030">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>フリックマスター｜フリック入力練習</title>
  <style>
:root {
  --bg: #1b2030;
  --bg-2: #232a3d;
  --panel: #2a3247;
  --key: #36405c;
  --key-press: #4d5b80;
  --accent: #ffb340;
  --accent-2: #4fc3f7;
  --good: #4caf50;
  --bad: #ef5350;
  --text: #f2f4fb;
  --muted: #97a1bd;
  --radius: 14px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
.screen.active { display: flex; }

/* --- 共通ボタン --- */
.btn {
  font-family: inherit;
  color: var(--text);
  background: var(--panel);
  border: none;
  border-radius: var(--radius);
  padding: 16px;
  font-size: 17px;
  cursor: pointer;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.97); }

/* --- ホーム --- */
.home-inner, .result-inner {
  margin: auto 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  padding: 24px 0;
}
.logo {
  text-align: center;
  font-size: 40px;
  margin: 0;
  font-weight: 800;
  letter-spacing: 1px;
}
.logo span { color: var(--accent); }
.tagline {
  text-align: center;
  color: var(--muted);
  margin: -6px 0 10px;
  font-size: 15px;
}
.mode-list { display: flex; flex-direction: column; gap: 12px; }
.mode-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-align: left;
  background: linear-gradient(135deg, var(--panel), var(--bg-2));
  border-left: 4px solid var(--accent-2);
}
.mode-btn.timeattack { border-left-color: var(--accent); }
.mode-name { font-size: 19px; font-weight: 700; }
.mode-desc { font-size: 13px; color: var(--muted); }
.hint {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin-top: 8px;
}

/* --- 行選択 --- */
.subtitle { text-align: center; font-size: 22px; margin: 0 0 8px; }
.group-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.group-btn { font-size: 20px; font-weight: 700; padding: 18px 0; }
.group-all-btn {
  margin-top: 6px;
  background: var(--accent-2);
  color: #06243a;
  font-weight: 700;
}

/* --- プレイ --- */
.play-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
}
.icon-btn {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 22px;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  cursor: pointer;
}
.guide-btn { opacity: .4; }
.guide-btn.on { opacity: 1; background: rgba(255,179,64,.2); }
.play-mode-label { font-size: 15px; color: var(--muted); }

.timer-wrap { text-align: center; margin-bottom: 4px; }
.timer-label { font-size: 12px; color: var(--muted); margin-right: 6px; }
.timer { font-size: 28px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

.prompt-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 90px;
}
.prompt {
  font-size: 46px;
  font-weight: 700;
  letter-spacing: 4px;
  text-align: center;
  transition: transform .1s ease;
}
.prompt.hit { animation: pop .18s ease; }
.prompt.miss { animation: nope .25s ease; }
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes nope { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.ch { color: var(--muted); padding: 0 1px; }
.ch.done { color: var(--good); }
.ch.cur { color: var(--text); border-bottom: 4px solid var(--accent); }

.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat {
  background: var(--bg-2);
  border-radius: 10px;
  padding: 8px 4px;
  text-align: center;
}
.stat-label { display: block; font-size: 10px; color: var(--muted); }
.stat-val { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* --- キーボード --- */
.keyboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 1fr;
  gap: 8px;
  padding-bottom: 8px;
  aspect-ratio: 3 / 4;
  max-height: 46dvh;
}
.keyboard.shake { animation: kbshake .25s ease; }
@keyframes kbshake { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-6px)} 60%{transform:translateX(6px)} }

.key {
  position: relative;
  background: var(--key);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
}
.key-blank { background: transparent; pointer-events: none; }
.key.pressed { background: var(--key-press); }
.key.guide {
  box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(255,179,64,.5);
  animation: guidePulse 1.2s ease-in-out infinite;
}
@keyframes guidePulse { 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 24px rgba(255,179,64,.8); } }

/* ガイドの方向を示す矢印 */
.key.guide::after {
  content: '';
  position: absolute;
  font-size: 20px;
  color: var(--accent);
}
.key.guide[data-guide-dir="up"]::after    { content:'▲'; top: 2px; }
.key.guide[data-guide-dir="down"]::after  { content:'▼'; bottom: 2px; }
.key.guide[data-guide-dir="left"]::after  { content:'◀'; left: 4px; }
.key.guide[data-guide-dir="right"]::after { content:'▶'; right: 4px; }
.key.guide[data-guide-dir="center"]::after { content:'●'; font-size: 12px; opacity:.7; }

/* フリックポップアップ（押下中に方向候補を表示） */
.flick-popup {
  position: absolute;
  inset: -50% -10%;
  pointer-events: none;
  display: none;
  z-index: 10;
}
.key.show-popup .flick-popup { display: block; }
.flick-seg {
  position: absolute;
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-2);
  border-radius: 10px;
  font-size: 24px;
  font-weight: 700;
  box-shadow: 0 4px 10px rgba(0,0,0,.4);
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}
.flick-center { }
.flick-up    { transform: translate(-50%, -130%); }
.flick-down  { transform: translate(-50%, 30%); }
.flick-left  { transform: translate(-130%, -50%); }
.flick-right { transform: translate(30%, -50%); }
.flick-seg.active {
  background: var(--accent);
  color: #2a1a00;
  transform: translate(-50%, -50%) scale(1.12);
}
.flick-seg.flick-up.active    { transform: translate(-50%, -130%) scale(1.12); }
.flick-seg.flick-down.active  { transform: translate(-50%, 30%) scale(1.12); }
.flick-seg.flick-left.active  { transform: translate(-130%, -50%) scale(1.12); }
.flick-seg.flick-right.active { transform: translate(30%, -50%) scale(1.12); }

/* --- 結果 --- */
.rank {
  font-size: 90px;
  font-weight: 900;
  text-align: center;
  line-height: 1;
  margin: 6px 0;
  color: var(--accent);
}
.rank[data-rank="S"] { color: #ffd54f; text-shadow: 0 0 20px rgba(255,213,79,.6); }
.rank[data-rank="A"] { color: #4fc3f7; }
.rank[data-rank="B"] { color: #81c784; }
.rank[data-rank="C"] { color: #ffb74d; }
.rank[data-rank="D"] { color: var(--muted); }
.new-record { text-align: center; color: var(--accent); font-weight: 700; margin: 0; }
.result-mode-label { text-align: center; color: var(--muted); margin: 0; }
.result-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.rstat {
  background: var(--bg-2);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rstat span { color: var(--muted); font-size: 14px; }
.rstat b { font-size: 22px; font-variant-numeric: tabular-nums; }
.primary-btn {
  background: var(--accent);
  color: #2a1a00;
  font-weight: 700;
  margin-top: 8px;
}

</style>
</head>
<body>
  <div id="app">

    <!-- ホーム -->
    <section id="screen-home" class="screen">
      <div class="home-inner">
        <h1 class="logo">フリック<span>マスター</span></h1>
        <p class="tagline">遊びながら、フリック入力を覚えよう</p>
        <div class="mode-list">
          <button class="btn mode-btn" data-mode="basic">
            <span class="mode-name">基礎れんしゅう</span>
            <span class="mode-desc">行を選んでガイドつきで練習</span>
          </button>
          <button class="btn mode-btn" data-mode="random">
            <span class="mode-name">ランダム文字</span>
            <span class="mode-desc">全文字からランダム出題</span>
          </button>
          <button class="btn mode-btn" data-mode="words">
            <span class="mode-name">ことば</span>
            <span class="mode-desc">単語を入力する実戦練習</span>
          </button>
          <button class="btn mode-btn timeattack" data-mode="timeattack">
            <span class="mode-name">タイムアタック</span>
            <span class="mode-desc">60秒で高スコアを狙え！</span>
          </button>
        </div>
        <p class="hint">キーを押して上下左右にフリック。指を離した方向の文字が入力されます。</p>
      </div>
    </section>

    <!-- 行選択 -->
    <section id="screen-group" class="screen">
      <div class="home-inner">
        <h2 class="subtitle">どの行をれんしゅうする？</h2>
        <div id="group-grid" class="group-grid"></div>
        <button id="group-all" class="btn group-all-btn">ぜんぶ（あ〜わ行）</button>
      </div>
    </section>

    <!-- プレイ -->
    <section id="screen-play" class="screen">
      <header class="play-header">
        <button id="quit-btn" class="icon-btn" aria-label="やめる">✕</button>
        <span id="play-mode-label" class="play-mode-label"></span>
        <button id="guide-toggle" class="icon-btn guide-btn" aria-label="ガイド切替">💡</button>
      </header>

      <div id="timer-wrap" class="timer-wrap" hidden>
        <span class="timer-label">のこり</span>
        <span id="timer" class="timer">60.0</span>
      </div>

      <div class="prompt-area">
        <div id="prompt" class="prompt"></div>
      </div>

      <div class="stats-bar">
        <div class="stat"><span class="stat-label">スコア</span><span id="stat-score" class="stat-val">0</span></div>
        <div class="stat"><span class="stat-label">コンボ</span><span id="stat-combo" class="stat-val">0</span></div>
        <div class="stat"><span class="stat-label">正確率</span><span id="stat-accuracy" class="stat-val">100%</span></div>
        <div class="stat"><span class="stat-label">文字/分</span><span id="stat-cpm" class="stat-val">0</span></div>
      </div>

      <div id="keyboard" class="keyboard"></div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen">
      <div class="result-inner">
        <h2 class="subtitle">けっか</h2>
        <div id="result-rank" class="rank">A</div>
        <p id="result-new" class="new-record" hidden>🎉 ハイスコア更新！</p>
        <p class="result-mode-label"><span id="result-mode"></span></p>
        <div class="result-grid">
          <div class="rstat"><span>スコア</span><b id="result-score">0</b></div>
          <div class="rstat"><span>ベスト</span><b id="result-best">0</b></div>
          <div class="rstat"><span>正確率</span><b id="result-accuracy">0%</b></div>
          <div class="rstat"><span>文字/分</span><b id="result-cpm">0</b></div>
          <div class="rstat"><span>最大コンボ</span><b id="result-maxcombo">0</b></div>
          <div class="rstat"><span>ミス</span><b id="result-mistakes">0</b></div>
        </div>
        <button id="retry-btn" class="btn primary-btn">ホームへ</button>
      </div>
    </section>

  </div>

  <script>
// フリックキーボードのデータ定義
// 各キー: center = タップで入力される文字, flicks = フリック方向ごとの文字
// 配置はスマホの標準的なテンキー配列に準拠（3列×4行）

const FLICK_KEYS = [
  // row 0
  { id: 'a',  center: 'あ', flicks: { left: 'い', up: 'う', right: 'え', down: 'お' } },
  { id: 'ka', center: 'か', flicks: { left: 'き', up: 'く', right: 'け', down: 'こ' } },
  { id: 'sa', center: 'さ', flicks: { left: 'し', up: 'す', right: 'せ', down: 'そ' } },
  // row 1
  { id: 'ta', center: 'た', flicks: { left: 'ち', up: 'つ', right: 'て', down: 'と' } },
  { id: 'na', center: 'な', flicks: { left: 'に', up: 'ぬ', right: 'ね', down: 'の' } },
  { id: 'ha', center: 'は', flicks: { left: 'ひ', up: 'ふ', right: 'へ', down: 'ほ' } },
  // row 2
  { id: 'ma', center: 'ま', flicks: { left: 'み', up: 'む', right: 'め', down: 'も' } },
  { id: 'ya', center: 'や', flicks: { up: 'ゆ', down: 'よ' } },
  { id: 'ra', center: 'ら', flicks: { left: 'り', up: 'る', right: 'れ', down: 'ろ' } },
  // row 3
  { id: 'blank', center: '', flicks: {} },
  { id: 'wa', center: 'わ', flicks: { left: 'を', up: 'ん', right: 'ー' } },
  { id: 'mark', center: '、', flicks: { left: '。', up: '？', right: '！' } },
];

// 文字 -> { keyId, direction } の逆引き表（ガイド表示・問題生成に使用）
const CHAR_TO_FLICK = (() => {
  const map = {};
  for (const key of FLICK_KEYS) {
    if (key.center) map[key.center] = { keyId: key.id, direction: 'center' };
    for (const [dir, ch] of Object.entries(key.flicks)) {
      map[ch] = { keyId: key.id, direction: dir };
    }
  }
  return map;
})();

// 行（あ行・か行…）ごとのグループ。基礎練習モードで使用。
const KANA_GROUPS = {
  a:  ['あ', 'い', 'う', 'え', 'お'],
  ka: ['か', 'き', 'く', 'け', 'こ'],
  sa: ['さ', 'し', 'す', 'せ', 'そ'],
  ta: ['た', 'ち', 'つ', 'て', 'と'],
  na: ['な', 'に', 'ぬ', 'ね', 'の'],
  ha: ['は', 'ひ', 'ふ', 'へ', 'ほ'],
  ma: ['ま', 'み', 'む', 'め', 'も'],
  ya: ['や', 'ゆ', 'よ'],
  ra: ['ら', 'り', 'る', 'れ', 'ろ'],
  wa: ['わ', 'を', 'ん', 'ー'],
};

const GROUP_LABELS = {
  a: 'あ行', ka: 'か行', sa: 'さ行', ta: 'た行', na: 'な行',
  ha: 'は行', ma: 'ま行', ya: 'や行', ra: 'ら行', wa: 'わ行',
};

// 入力可能な全ひらがな（濁点・小書きを除く基本文字）
const ALL_KANA = Object.values(KANA_GROUPS).flat();

// ことばモード用の単語リスト（このキーボードで入力できる基本ひらがなのみで構成）
const WORDS = [
  'すし', 'みかん', 'さくら', 'ねこ', 'いぬ', 'うみ', 'やま',
  'そら', 'ほし', 'つき', 'はな', 'とり', 'くるま',
  'てかみ', 'おにくり', 'みそしる', 'たまこ',
  'あめ', 'ゆき', 'かせ', 'もり', 'かわ', 'いし', 'はね',
  'ひこうき', 'しんかんせん', 'こうえん',
  'ともたち', 'せんせい', 'おかあさん', 'おとうさん', 'おはよう', 'こんにちは',
  'ありかとう', 'さようなら', 'なつやすみ', 'ふゆやすみ',
  'えほん', 'おんかく', 'うんとうかい', 'たいいくかん',
];

// フリックキーボード: 描画とジェスチャー検出を担当
// 文字が確定したら onInput(char) コールバックを呼ぶ。

class FlickKeyboard {
  constructor(rootEl, onInput) {
    this.root = rootEl;
    this.onInput = onInput;
    this.threshold = 28; // タップ/フリックを判定する移動距離(px)
    this.keyEls = {};    // keyId -> element
    this.active = null;  // 現在ドラッグ中のキー情報
    this.guide = null;   // { keyId, direction } ハイライト用
    this._build();
  }

  _build() {
    this.root.innerHTML = '';
    this.root.classList.add('keyboard');

    for (const key of FLICK_KEYS) {
      const cell = document.createElement('div');
      cell.className = 'key';
      if (!key.center) {
        cell.classList.add('key-blank');
        this.root.appendChild(cell);
        continue;
      }
      cell.dataset.keyId = key.id;

      const main = document.createElement('span');
      main.className = 'key-main';
      main.textContent = key.center;
      cell.appendChild(main);

      // フリック方向のミニ表示（タップ中に出るポップアップの素）
      const popup = document.createElement('div');
      popup.className = 'flick-popup';
      for (const dir of ['up', 'down', 'left', 'right', 'center']) {
        const ch = dir === 'center' ? key.center : key.flicks[dir];
        if (!ch) continue;
        const seg = document.createElement('span');
        seg.className = 'flick-seg flick-' + dir;
        seg.textContent = ch;
        seg.dataset.dir = dir;
        popup.appendChild(seg);
      }
      cell.appendChild(popup);

      this.keyEls[key.id] = cell;
      this._bindPointer(cell, key);
      this.root.appendChild(cell);
    }
  }

  _bindPointer(cell, key) {
    const start = (clientX, clientY) => {
      this.active = { key, startX: clientX, startY: clientY, dir: 'center' };
      cell.classList.add('pressed');
      this._updatePopup(cell, 'center');
    };

    const move = (clientX, clientY) => {
      if (!this.active || this.active.key !== key) return;
      const dir = this._dirFor(clientX - this.active.startX, clientY - this.active.startY, key);
      this.active.dir = dir;
      this._updatePopup(cell, dir);
    };

    const end = () => {
      if (!this.active || this.active.key !== key) return;
      const dir = this.active.dir;
      const ch = dir === 'center' ? key.center : key.flicks[dir];
      cell.classList.remove('pressed');
      this._clearPopup(cell);
      this.active = null;
      if (ch) this.onInput(ch);
    };

    // タッチ
    cell.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      start(t.clientX, t.clientY);
    }, { passive: false });
    cell.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      move(t.clientX, t.clientY);
    }, { passive: false });
    cell.addEventListener('touchend', (e) => {
      e.preventDefault();
      end();
    }, { passive: false });
    cell.addEventListener('touchcancel', () => {
      cell.classList.remove('pressed');
      this._clearPopup(cell);
      this.active = null;
    });

    // マウス（PCでの動作確認用）
    cell.addEventListener('mousedown', (e) => {
      e.preventDefault();
      start(e.clientX, e.clientY);
      const onMove = (ev) => move(ev.clientX, ev.clientY);
      const onUp = () => {
        end();
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
  }

  // 移動量から方向を決定。利用可能な方向のみ返し、無ければ center。
  _dirFor(dx, dy, key) {
    const dist = Math.hypot(dx, dy);
    if (dist < this.threshold) return 'center';
    let dir;
    if (Math.abs(dx) > Math.abs(dy)) {
      dir = dx > 0 ? 'right' : 'left';
    } else {
      dir = dy > 0 ? 'down' : 'up';
    }
    return key.flicks[dir] ? dir : 'center';
  }

  _updatePopup(cell, dir) {
    cell.classList.add('show-popup');
    cell.querySelectorAll('.flick-seg').forEach((seg) => {
      seg.classList.toggle('active', seg.dataset.dir === dir);
    });
  }

  _clearPopup(cell) {
    cell.classList.remove('show-popup');
    cell.querySelectorAll('.flick-seg').forEach((seg) => seg.classList.remove('active'));
  }

  // 次に打つ文字のキーと方向をハイライト（学習ガイド）
  setGuide(char) {
    this.clearGuide();
    if (!char) return;
    const info = CHAR_TO_FLICK[char];
    if (!info) return;
    this.guide = info;
    const cell = this.keyEls[info.keyId];
    if (!cell) return;
    cell.classList.add('guide');
    cell.dataset.guideDir = info.direction;
  }

  clearGuide() {
    if (this.guide) {
      const cell = this.keyEls[this.guide.keyId];
      if (cell) {
        cell.classList.remove('guide');
        delete cell.dataset.guideDir;
      }
      this.guide = null;
    }
  }

  // 入力ミスのフィードバック（軽い振動＋点滅）
  flashWrong() {
    if (navigator.vibrate) navigator.vibrate(40);
    this.root.classList.remove('shake');
    void this.root.offsetWidth; // reflow でアニメ再生
    this.root.classList.add('shake');
  }
}

// ゲーム本体: モードごとの問題生成・採点・進行管理

const MODES = {
  basic: {
    label: '基礎れんしゅう',
    desc: '行を選んで1文字ずつ。ガイドつきで指の動きを覚える。',
    timed: false,
    needsGroup: true,
    guideDefault: true,
    makeQueue(opts) {
      // 選んだ行の文字をシャッフルして2周
      const base = KANA_GROUPS[opts.group] || ALL_KANA;
      const q = shuffle([...base, ...base]);
      return q.map((c) => ({ text: c }));
    },
  },
  random: {
    label: 'ランダム文字',
    desc: '全部の文字からランダム出題。ガイドなしで腕だめし。',
    timed: false,
    needsGroup: false,
    guideDefault: false,
    makeQueue() {
      return shuffle(ALL_KANA).slice(0, 20).map((c) => ({ text: c }));
    },
  },
  words: {
    label: 'ことば',
    desc: '単語を入力。実戦に近い練習。',
    timed: false,
    needsGroup: false,
    guideDefault: false,
    makeQueue() {
      return shuffle([...WORDS]).slice(0, 10).map((w) => ({ text: w }));
    },
  },
  timeattack: {
    label: 'タイムアタック',
    desc: '60秒で何文字打てる？スコアを競おう。',
    timed: true,
    duration: 60,
    needsGroup: false,
    guideDefault: false,
    makeQueue() {
      // 時間切れまで補充するので長めに用意
      return shuffle([...WORDS, ...WORDS, ...WORDS]).map((w) => ({ text: w }));
    },
  },
};

class Game {
  constructor({ keyboard, ui }) {
    this.keyboard = keyboard;
    this.ui = ui;
    this.keyboard.onInput = (ch) => this.handleInput(ch);
    this.reset();
  }

  reset() {
    this.mode = null;
    this.queue = [];
    this.qIndex = 0;
    this.charIndex = 0;
    this.correct = 0;
    this.mistakes = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.score = 0;
    this.startTime = 0;
    this.running = false;
    this.showGuide = false;
    this.timerId = null;
  }

  start(modeKey, opts = {}) {
    this.reset();
    this.mode = MODES[modeKey];
    this.modeKey = modeKey;
    this.queue = this.mode.makeQueue(opts);
    this.showGuide = opts.guide !== undefined ? opts.guide : this.mode.guideDefault;
    this.running = true;
    this.startTime = performance.now();

    if (this.mode.timed) {
      this.remaining = this.mode.duration;
      this._tick();
      this.timerId = setInterval(() => this._tick(), 200);
    }
    this._renderPrompt();
    this.ui.updateStats(this.statsSnapshot());
  }

  _tick() {
    const elapsed = (performance.now() - this.startTime) / 1000;
    this.remaining = Math.max(0, this.mode.duration - elapsed);
    this.ui.updateTimer(this.remaining);
    if (this.remaining <= 0) this.finish();
  }

  get currentPrompt() {
    return this.queue[this.qIndex];
  }

  get currentChar() {
    const p = this.currentPrompt;
    return p ? p.text[this.charIndex] : null;
  }

  _renderPrompt() {
    const p = this.currentPrompt;
    if (!p) { this.finish(); return; }
    this.ui.showPrompt(p.text, this.charIndex);
    if (this.showGuide) {
      this.keyboard.setGuide(this.currentChar);
    } else {
      this.keyboard.clearGuide();
    }
  }

  handleInput(ch) {
    if (!this.running) return;
    const expected = this.currentChar;
    if (ch === expected) {
      this.correct++;
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      // コンボに応じた加点
      this.score += 10 + Math.min(this.combo, 20);
      this.charIndex++;
      this.ui.markCorrect(this.charIndex);

      if (this.charIndex >= this.currentPrompt.text.length) {
        // 単語クリアのボーナス
        this.score += 20;
        this.qIndex++;
        this.charIndex = 0;
        // タイムアタックでキューが尽きそうなら補充
        if (this.mode.timed && this.qIndex >= this.queue.length - 2) {
          this.queue.push(...shuffle([...WORDS]).map((w) => ({ text: w })));
        }
      }
      this._renderPrompt();
      if (!this.mode.timed && this.qIndex >= this.queue.length) this.finish();
    } else {
      this.mistakes++;
      this.combo = 0;
      this.keyboard.flashWrong();
      this.ui.markWrong();
    }
    this.ui.updateStats(this.statsSnapshot());
  }

  statsSnapshot() {
    const elapsed = Math.max(0.001, (performance.now() - this.startTime) / 1000);
    const total = this.correct + this.mistakes;
    const accuracy = total ? Math.round((this.correct / total) * 100) : 100;
    const cpm = Math.round((this.correct / elapsed) * 60); // 1分あたり文字数
    return {
      score: this.score,
      combo: this.combo,
      maxCombo: this.maxCombo,
      accuracy,
      cpm,
      correct: this.correct,
      mistakes: this.mistakes,
      elapsed,
    };
  }

  finish() {
    if (!this.running) return;
    this.running = false;
    if (this.timerId) clearInterval(this.timerId);
    this.keyboard.clearGuide();
    const stats = this.statsSnapshot();
    stats.modeLabel = this.mode.label;
    stats.rank = rankFor(stats);
    this.ui.showResult(stats);
  }

  toggleGuide() {
    this.showGuide = !this.showGuide;
    this._renderPrompt();
    return this.showGuide;
  }
}

function rankFor(stats) {
  // 正確率と速度から簡易ランク
  const s = stats.accuracy * 0.6 + Math.min(stats.cpm, 120) * 0.6;
  if (stats.accuracy >= 98 && stats.cpm >= 90) return 'S';
  if (s >= 110) return 'A';
  if (s >= 90) return 'B';
  if (s >= 70) return 'C';
  return 'D';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 画面遷移・UIバインドのエントリポイント

const screens = {
  home: document.getElementById('screen-home'),
  group: document.getElementById('screen-group'),
  play: document.getElementById('screen-play'),
  result: document.getElementById('screen-result'),
};

function showScreen(name) {
  Object.entries(screens).forEach(([k, el]) => {
    el.classList.toggle('active', k === name);
  });
}

// プレイ画面の各要素
const els = {
  prompt: document.getElementById('prompt'),
  score: document.getElementById('stat-score'),
  combo: document.getElementById('stat-combo'),
  accuracy: document.getElementById('stat-accuracy'),
  cpm: document.getElementById('stat-cpm'),
  timer: document.getElementById('timer'),
  guideBtn: document.getElementById('guide-toggle'),
};

// Game に渡す UI 実装
const ui = {
  showPrompt(text, charIndex) {
    els.prompt.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
      const span = document.createElement('span');
      span.className = 'ch';
      if (i < charIndex) span.classList.add('done');
      else if (i === charIndex) span.classList.add('cur');
      span.textContent = text[i];
      els.prompt.appendChild(span);
    }
  },
  markCorrect(charIndex) {
    const chars = els.prompt.querySelectorAll('.ch');
    chars.forEach((c, i) => {
      c.classList.toggle('done', i < charIndex);
      c.classList.toggle('cur', i === charIndex);
    });
    els.prompt.classList.remove('hit');
    void els.prompt.offsetWidth;
    els.prompt.classList.add('hit');
  },
  markWrong() {
    els.prompt.classList.remove('miss');
    void els.prompt.offsetWidth;
    els.prompt.classList.add('miss');
  },
  updateStats(s) {
    els.score.textContent = s.score;
    els.combo.textContent = s.combo;
    els.accuracy.textContent = s.accuracy + '%';
    els.cpm.textContent = s.cpm;
  },
  updateTimer(remaining) {
    els.timer.textContent = remaining.toFixed(1);
  },
  showResult(stats) {
    document.getElementById('result-rank').textContent = stats.rank;
    document.getElementById('result-rank').dataset.rank = stats.rank;
    document.getElementById('result-mode').textContent = stats.modeLabel;
    document.getElementById('result-score').textContent = stats.score;
    document.getElementById('result-accuracy').textContent = stats.accuracy + '%';
    document.getElementById('result-cpm').textContent = stats.cpm;
    document.getElementById('result-maxcombo').textContent = stats.maxCombo;
    document.getElementById('result-mistakes').textContent = stats.mistakes;
    saveBest(stats);
    showScreen('result');
  },
};

// ベストスコアの保存（localStorage）
function saveBest(stats) {
  const key = 'flick_best_' + (game.modeKey || 'x');
  const prev = Number(localStorage.getItem(key) || 0);
  const best = Math.max(prev, stats.score);
  localStorage.setItem(key, best);
  const el = document.getElementById('result-best');
  el.textContent = best;
  document.getElementById('result-new').hidden = !(stats.score >= best && stats.score > prev);
}

// 初期化
const keyboard = new FlickKeyboard(document.getElementById('keyboard'), () => {});
const game = new Game({ keyboard, ui });

let pendingMode = null;

// --- ホーム画面: モード選択 ---
document.querySelectorAll('[data-mode]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const modeKey = btn.dataset.mode;
    if (MODES[modeKey].needsGroup) {
      pendingMode = modeKey;
      showScreen('group');
    } else {
      startGame(modeKey, {});
    }
  });
});

// --- 行選択画面 ---
const groupGrid = document.getElementById('group-grid');
Object.entries(GROUP_LABELS).forEach(([key, label]) => {
  const btn = document.createElement('button');
  btn.className = 'btn group-btn';
  btn.textContent = label;
  btn.addEventListener('click', () => startGame(pendingMode, { group: key }));
  groupGrid.appendChild(btn);
});
document.getElementById('group-all').addEventListener('click', () => {
  startGame(pendingMode, { group: null });
});

function startGame(modeKey, opts) {
  const mode = MODES[modeKey];
  document.getElementById('play-mode-label').textContent = mode.label;
  // タイマー表示の有無
  document.getElementById('timer-wrap').hidden = !mode.timed;
  showScreen('play');
  game.start(modeKey, opts);
  els.guideBtn.classList.toggle('on', game.showGuide);
}

// --- プレイ中のボタン ---
els.guideBtn.addEventListener('click', () => {
  const on = game.toggleGuide();
  els.guideBtn.classList.toggle('on', on);
});
document.getElementById('quit-btn').addEventListener('click', () => {
  game.running = false;
  if (game.timerId) clearInterval(game.timerId);
  keyboard.clearGuide();
  showScreen('home');
});

// --- 結果画面のボタン ---
document.getElementById('retry-btn').addEventListener('click', () => {
  showScreen('home');
});

showScreen('home');

</script>
