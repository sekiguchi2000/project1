<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffb3c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>フリックぼうけん｜たのしくフリック入力</title>
  <style>
:root {
  --bg: #fff6ee;
  --bg-2: #ffeede;
  --card: #ffffff;
  --pink: #ff7fa3;
  --pink-soft: #ffd7e2;
  --mint: #6fd6b0;
  --mint-dark: #3fae8c;
  --yellow: #ffcf5c;
  --ink: #5b4a52;
  --muted: #a99aa2;
  --good: #43c08a;
  --bad: #ff6b6b;
  --key: #fff;
  --key-press: #ffe7c2;
  --r: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--ink);
  font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  overscroll-behavior: none; touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
#app { height: 100dvh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }

.screen { position: absolute; inset: 0; display: none; flex-direction: column;
  padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom); }
.screen.active { display: flex; }

/* ボタン共通 */
.btn { font-family: inherit; color: var(--ink); background: var(--card);
  border: none; border-radius: var(--r); padding: 15px; font-size: 16px; cursor: pointer;
  box-shadow: 0 3px 0 rgba(0,0,0,.06); transition: transform .08s ease; }
.btn:active { transform: translateY(2px) scale(.99); box-shadow: 0 1px 0 rgba(0,0,0,.06); }
.icon-btn { background: rgba(255,255,255,.7); border: none; color: var(--ink); font-size: 20px;
  width: 42px; height: 42px; border-radius: 14px; cursor: pointer; }

/* ===== マスコット ===== */
.mascot-slot { display: inline-block; }
.mascot-svg { width: 100%; height: 100%; display: block; }
.m-body { fill: var(--mint); }
.m-shadow { fill: rgba(0,0,0,.07); }
.m-cheek { fill: #ff9bb3; opacity: .8; }
.m-eyes-happy path, .m-eyes-hurt path, .m-mouth-smile, .m-mouth-hurt {
  fill: none; stroke: #2c2c3a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.m-mouth-open { fill: #2c2c3a; }
.mascot-slot .m-eyes-happy, .mascot-slot .m-eyes-hurt,
.mascot-slot .m-mouth-open, .mascot-slot .m-mouth-hurt { display: none; }
.mascot-slot[data-mood="happy"] .m-eyes-open, .mascot-slot[data-mood="happy"] .m-mouth-smile { display: none; }
.mascot-slot[data-mood="happy"] .m-eyes-happy, .mascot-slot[data-mood="happy"] .m-mouth-open { display: block; }
.mascot-slot[data-mood="hurt"] .m-eyes-open, .mascot-slot[data-mood="hurt"] .m-mouth-smile { display: none; }
.mascot-slot[data-mood="hurt"] .m-eyes-hurt, .mascot-slot[data-mood="hurt"] .m-mouth-hurt { display: block; }
.mascot-svg { animation: bob 2.4s ease-in-out infinite; transform-origin: center bottom; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* ===== ホーム ===== */
.home-scroll { flex: 1; overflow-y: auto; padding: 6px 2px 20px; display: flex; flex-direction: column; gap: 12px; }
.mute-btn { position: absolute; top: calc(env(safe-area-inset-top) + 6px); right: 14px; z-index: 5;
  background: rgba(255,255,255,.8); border: none; width: 40px; height: 40px; border-radius: 14px; font-size: 18px; }
.logo { text-align: center; font-size: 34px; margin: 8px 0 0; font-weight: 800; color: var(--pink); }
.logo span { color: var(--mint-dark); }
.player-card { display: flex; align-items: center; gap: 12px; background: var(--card);
  border-radius: var(--r); padding: 12px 14px; box-shadow: 0 3px 0 rgba(0,0,0,.05); }
.mascot-home { width: 64px; height: 64px; flex: none; }
.player-info { flex: 1; }
.lvl-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.lvl-badge { background: var(--mint); color: #fff; font-weight: 800; padding: 3px 10px; border-radius: 999px; font-size: 14px; }
.lvl-badge.small { font-size: 12px; padding: 2px 8px; }
.coins { font-weight: 700; color: var(--ink); }
.xp-bar { height: 12px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--yellow), #ffb03a); border-radius: 999px; transition: width .4s ease; }
.xp-text { text-align: right; font-size: 11px; color: var(--muted); margin-top: 3px; }

.adventure-btn { display: flex; align-items: center; gap: 14px; text-align: left;
  background: linear-gradient(135deg, #ff9bb6, #ff7fa3); color: #fff; padding: 18px; }
.adv-emoji { font-size: 34px; }
.adv-text b { font-size: 20px; display: block; }
.adv-text small { font-size: 12px; opacity: .95; }

.section-title { margin: 6px 4px -2px; font-size: 13px; color: var(--muted); font-weight: 700; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border-left: 5px solid var(--mint); }
.mode-btn b { font-size: 17px; }
.mode-btn small { font-size: 11px; color: var(--muted); }
.hint { text-align: center; color: var(--muted); font-size: 11px; line-height: 1.6; margin: 6px 0 0; }

/* ===== サブヘッダ ===== */
.sub-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.sub-title { font-size: 18px; font-weight: 800; }

/* ===== ステージ一覧 ===== */
.stage-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 6px 2px 20px; }
.stage-card { display: flex; align-items: center; gap: 12px; text-align: left; color: #fff; padding: 16px; }
.stage-card.locked { filter: grayscale(.7) brightness(.92); color: rgba(255,255,255,.85); }
.stage-num { font-size: 26px; font-weight: 900; width: 36px; text-align: center; opacity: .9; }
.stage-info { flex: 1; }
.stage-info b { font-size: 18px; display: block; }
.stage-info small { font-size: 12px; opacity: .95; }
.stage-go { font-size: 20px; }
.stage-grass { background: linear-gradient(135deg, #7ed957, #4fae5a); }
.stage-cave  { background: linear-gradient(135deg, #8e7cc3, #6a5acd); }
.stage-sky   { background: linear-gradient(135deg, #5ec5ff, #3a8fd8); }
.stage-tower { background: linear-gradient(135deg, #ff7b7b, #c0392b); }

/* ===== 行選択 ===== */
.group-wrap { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.group-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.group-btn { font-size: 19px; font-weight: 800; padding: 18px 0; }
.group-all-btn { background: var(--mint); color: #fff; font-weight: 800; }

/* ===== プレイ共通 ===== */
.play-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.play-mode-label { font-size: 15px; font-weight: 700; color: var(--ink); }
.guide-btn { opacity: .4; }
.guide-btn.on { opacity: 1; background: var(--yellow); }
.progress-pill { background: var(--ink); color: #fff; font-weight: 800; padding: 4px 12px; border-radius: 999px; font-size: 14px; }

.timer-wrap { text-align: center; }
.timer-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
.timer { font-size: 26px; font-weight: 900; color: var(--pink); font-variant-numeric: tabular-nums; }

.prompt-area { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 70px; }
.prompt { font-size: 44px; font-weight: 800; letter-spacing: 3px; text-align: center; transition: transform .1s ease; }
.prompt.hit { animation: pop .18s ease; }
.prompt.miss { animation: nope .25s ease; }
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes nope { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
.ch { color: var(--muted); padding: 0 1px; }
.ch.done { color: var(--good); }
.ch.cur { color: var(--ink); border-bottom: 5px solid var(--pink); }
.ch.pending { color: var(--yellow); }

.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 10px; }
.stat { background: var(--card); border-radius: 12px; padding: 7px 4px; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,.05); }
.stat-label { display: block; font-size: 10px; color: var(--muted); }
.stat-val { display: block; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* ===== キーボード（実機の5列配列を再現） ===== */
.kb-slot { padding-bottom: 4px; }
.keyboard { display: grid; grid-template-columns: 0.8fr 1fr 1fr 1fr 0.8fr; grid-template-rows: repeat(4, 1fr);
  gap: 5px; height: 38dvh; max-height: 320px; }
.keyboard.shake { animation: kbshake .25s ease; }
@keyframes kbshake { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-6px)} 60%{transform:translateX(6px)} }
.key { position: relative; background: var(--key); border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 22px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.key:active, .key.pressed { background: var(--key-press); transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.key-mod { background: var(--bg-2); font-size: 13px; color: var(--mint-dark); font-weight: 800; }
/* 機能キー: 見た目だけ（タップしても反応しない） */
.key-fn { background: var(--bg-2); color: var(--muted); font-size: 12px; font-weight: 700;
  pointer-events: none; box-shadow: 0 2px 0 rgba(0,0,0,.05); }
.key-enter { background: var(--mint); color: #fff; font-size: 13px; pointer-events: none; }
.key.guide { box-shadow: 0 0 0 3px var(--pink), 0 0 14px rgba(255,127,163,.5); animation: gpulse 1.1s ease-in-out infinite; }
@keyframes gpulse { 50% { box-shadow: 0 0 0 3px var(--pink), 0 0 22px rgba(255,127,163,.8); } }
.key.guide::after { content: ''; position: absolute; font-size: 18px; color: var(--pink); }
.key.guide[data-guide-dir="up"]::after    { content:'▲'; top: 1px; }
.key.guide[data-guide-dir="down"]::after  { content:'▼'; bottom: 1px; }
.key.guide[data-guide-dir="left"]::after  { content:'◀'; left: 3px; }
.key.guide[data-guide-dir="right"]::after { content:'▶'; right: 3px; }
.key.guide[data-guide-dir="center"]::after { content:'●'; font-size: 10px; }
.key-mod.guide-mod { box-shadow: 0 0 0 3px var(--yellow); animation: gpulse 1.1s ease-in-out infinite; }
.key-mod.guide-mod::after { content: '×' attr(data-mods); position: absolute; top: 2px; right: 5px; font-size: 13px; color: var(--pink); }

/* フリックポップアップ */
.flick-popup { position: absolute; inset: -50% -10%; pointer-events: none; display: none; z-index: 10; }
.key.show-popup .flick-popup { display: block; }
.flick-seg { position: absolute; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: #fff; border-radius: 12px; font-size: 23px; font-weight: 800;
  box-shadow: 0 4px 10px rgba(0,0,0,.3); left: 50%; top: 50%; transform: translate(-50%, -50%); }
.flick-up    { transform: translate(-50%, -130%); }
.flick-down  { transform: translate(-50%, 30%); }
.flick-left  { transform: translate(-130%, -50%); }
.flick-right { transform: translate(30%, -50%); }
.flick-seg.active { background: var(--pink); transform: translate(-50%, -50%) scale(1.12); }
.flick-seg.flick-up.active    { transform: translate(-50%, -130%) scale(1.12); }
.flick-seg.flick-down.active  { transform: translate(-50%, 30%) scale(1.12); }
.flick-seg.flick-left.active  { transform: translate(-130%, -50%) scale(1.12); }
.flick-seg.flick-right.active { transform: translate(30%, -50%) scale(1.12); }

/* ===== RPG バトル ===== */
.rpg-arena { position: relative; border-radius: 20px; padding: 14px; margin-bottom: 8px;
  min-height: 150px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; color: #fff; }
.rpg-arena.shake-arena { animation: kbshake .3s ease; }
.rpg-arena.stage-grass { background: linear-gradient(160deg, #aee98a, #6fc36a); }
.rpg-arena.stage-cave  { background: linear-gradient(160deg, #9a8bd0, #6a5acd); }
.rpg-arena.stage-sky   { background: linear-gradient(160deg, #8fd6ff, #4a9fe0); }
.rpg-arena.stage-tower { background: linear-gradient(160deg, #ff9a9a, #c0392b); }
.monster-box { display: flex; align-items: center; gap: 14px; }
.monster-emoji { font-size: 56px; line-height: 1; filter: drop-shadow(0 4px 4px rgba(0,0,0,.2)); animation: float 2.6s ease-in-out infinite; }
.monster-emoji.boss { font-size: 70px; }
@keyframes float { 50% { transform: translateY(-6px); } }
.monster-emoji.enter { animation: enter .4s ease; }
@keyframes enter { from { transform: translateX(60px) scale(.5); opacity: 0; } }
.monster-emoji.hurt { animation: mhurt .25s ease; }
@keyframes mhurt { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px) rotate(-6deg)} 75%{transform:translateX(8px) rotate(6deg)} }
.monster-emoji.dead { animation: dead .8s ease forwards; }
@keyframes dead { to { transform: scale(0) rotate(90deg); opacity: 0; } }
.monster-meta { flex: 1; }
.monster-name { font-weight: 800; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.mhp-bar { height: 12px; background: rgba(0,0,0,.25); border-radius: 999px; overflow: hidden; margin-top: 5px; }
.mhp-fill { height: 100%; background: linear-gradient(90deg, #ffe14d, #ff5757); border-radius: 999px; transition: width .25s ease; }
.atk-bar { height: 6px; background: rgba(0,0,0,.2); border-radius: 999px; overflow: hidden; margin-top: 5px; }
.atk-fill { height: 100%; width: 0; background: #fff; opacity: .7; }
.atk-fill.full { background: #ff3b3b; opacity: 1; }
.speech { position: absolute; bottom: 8px; right: 12px; background: #fff; color: var(--ink);
  padding: 6px 12px; border-radius: 14px; font-weight: 700; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
.rpg-fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.popup { position: absolute; top: 30%; font-weight: 900; font-size: 24px; animation: rise .9s ease forwards; text-shadow: 0 2px 3px rgba(0,0,0,.3); }
.popup.dmg { color: #fff; }
.popup.crit { color: #ffe14d; font-size: 30px; }
.popup.xp { color: #aaffc4; top: 50%; }
.popup.player-dmg { color: #ff6b6b; top: 60%; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }
.rpg-prompt-area { min-height: 60px; flex: 1 1 auto; padding: 6px 0; }
.rpg-prompt-area .prompt { font-size: 38px; }
.player-bar { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px;
  padding: 8px 12px; margin-bottom: 8px; box-shadow: 0 2px 0 rgba(0,0,0,.05); }
.mascot-battle { width: 46px; height: 46px; flex: none; }
.php-wrap { flex: 1; }
.php-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
.php-bar { height: 14px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.php-fill { height: 100%; background: linear-gradient(90deg, #5be38a, #2bbf6a); border-radius: 999px; transition: width .3s ease; }
.php-fill.low { background: linear-gradient(90deg, #ff8a5b, #ff5757); }

/* ===== 結果 ===== */
.result-inner { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 6px; }
.mascot-result { width: 90px; height: 90px; }
.result-title { font-size: 26px; margin: 0; font-weight: 900; }
.rank { font-size: 80px; font-weight: 900; line-height: 1; margin: 0; }
.rank[data-rank="S"] { color: var(--yellow); text-shadow: 0 0 18px rgba(255,207,92,.7); }
.rank[data-rank="A"] { color: var(--mint-dark); }
.rank[data-rank="B"] { color: #5ec5ff; }
.rank[data-rank="C"] { color: #ffb03a; }
.rank[data-rank="D"] { color: var(--muted); }
.new-record { color: var(--pink); font-weight: 800; margin: 0; }
.levelup-banner { background: var(--yellow); color: #7a5200; font-weight: 800; padding: 8px 16px; border-radius: 999px; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
.rstat { background: var(--card); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between;
  align-items: center; box-shadow: 0 2px 0 rgba(0,0,0,.05); }
.rstat span { color: var(--muted); font-size: 13px; }
.rstat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.result-note { text-align: center; color: var(--mint-dark); font-weight: 700; margin: 0; }
.result-actions { display: flex; gap: 10px; width: 100%; margin-top: 6px; }
.result-actions .btn { flex: 1; }
.primary-btn { background: var(--pink); color: #fff; font-weight: 800; }
.ghost-btn { background: var(--card); }

</style>
</head>
<body>
  <!-- マスコット(モモ)のSVGテンプレート -->
  <template id="mascot-svg">
    <svg class="mascot-svg" viewBox="0 0 120 120" aria-hidden="true">
      <ellipse class="m-shadow" cx="60" cy="104" rx="34" ry="8"/>
      <path class="m-body" d="M60 16 C92 16 100 56 100 78 C100 100 82 110 60 110 C38 110 20 100 20 78 C20 56 28 16 60 16 Z"/>
      <ellipse class="m-cheek" cx="38" cy="74" rx="8" ry="6"/>
      <ellipse class="m-cheek" cx="82" cy="74" rx="8" ry="6"/>
      <!-- 目: ぱっちり -->
      <g class="m-eyes-open">
        <circle cx="44" cy="62" r="9" fill="#fff"/><circle cx="76" cy="62" r="9" fill="#fff"/>
        <circle cx="45" cy="64" r="5.5" fill="#2c2c3a"/><circle cx="77" cy="64" r="5.5" fill="#2c2c3a"/>
        <circle cx="42" cy="60" r="2" fill="#fff"/><circle cx="74" cy="60" r="2" fill="#fff"/>
      </g>
      <!-- 目: にこっ(閉じ) -->
      <g class="m-eyes-happy">
        <path d="M37 64 Q44 56 51 64" /><path d="M69 64 Q76 56 83 64" />
      </g>
      <!-- 目: ><(こまり) -->
      <g class="m-eyes-hurt">
        <path d="M38 58 L50 66 M50 58 L38 66"/><path d="M70 58 L82 66 M82 58 L70 66"/>
      </g>
      <path class="m-mouth-smile" d="M50 82 Q60 92 70 82"/>
      <path class="m-mouth-open" d="M50 82 Q60 98 70 82 Q60 90 50 82 Z"/>
      <path class="m-mouth-hurt" d="M50 88 Q55 82 60 88 Q65 94 70 88"/>
    </svg>
  </template>

  <div id="app">

    <!-- ===== ホーム ===== -->
    <section id="screen-home" class="screen active">
      <div class="home-scroll">
        <button id="mute-btn" class="mute-btn" aria-label="音">🔊</button>
        <h1 class="logo">フリック<span>ぼうけん</span></h1>

        <div class="player-card">
          <div class="mascot-slot mascot-home" data-mood="happy"></div>
          <div class="player-info">
            <div class="lvl-row"><span class="lvl-badge">Lv.<b id="home-level">1</b></span><span id="home-coins" class="coins">🪙 0</span></div>
            <div class="xp-bar"><div id="home-xp-fill" class="xp-fill"></div></div>
            <div class="xp-text"><span id="home-xp-text">0 / 20</span></div>
          </div>
        </div>

        <button class="btn adventure-btn" data-go="stages">
          <span class="adv-emoji">⚔️</span>
          <span class="adv-text"><b>ぼうけんモード</b><small>モンスターをたおして レベルアップ！</small></span>
        </button>

        <p class="section-title">れんしゅうモード</p>
        <div class="mode-grid">
          <button class="btn mode-btn" data-mode="basic"><b>きそ</b><small>行べつ・ガイドつき</small></button>
          <button class="btn mode-btn" data-mode="random"><b>ランダム</b><small>腕だめし</small></button>
          <button class="btn mode-btn" data-mode="words"><b>ことば</b><small>単語入力</small></button>
          <button class="btn mode-btn" data-mode="timeattack"><b>タイム</b><small>60秒勝負</small></button>
        </div>
        <p class="hint">キーを押して上下左右にフリック。「小゛゜」で濁点・小書きに変換できるよ。</p>
      </div>
    </section>

    <!-- ===== ステージ選択 ===== -->
    <section id="screen-stages" class="screen">
      <header class="sub-header">
        <button class="icon-btn" data-go="home">←</button>
        <span class="sub-title">ぼうけんマップ</span>
        <span class="lvl-badge small">Lv.<b id="stages-level">1</b></span>
      </header>
      <div id="stage-list" class="stage-list"></div>
    </section>

    <!-- ===== 行選択(きそ) ===== -->
    <section id="screen-group" class="screen">
      <header class="sub-header">
        <button class="icon-btn" data-go="home">←</button>
        <span class="sub-title">どの行をれんしゅう？</span><span></span>

  <script>
// ============================================================
// フリック入力データ & 入力判定ロジック
// ============================================================

// 12キーのフリック配列（スマホ標準のテンキー準拠）
// isModifier: 直前の文字を 濁点→半濁点→小書き と変換する特殊キー
const FLICK_KEYS = [
  { id: 'a',  center: 'あ', flicks: { left: 'い', up: 'う', right: 'え', down: 'お' } },
  { id: 'ka', center: 'か', flicks: { left: 'き', up: 'く', right: 'け', down: 'こ' } },
  { id: 'sa', center: 'さ', flicks: { left: 'し', up: 'す', right: 'せ', down: 'そ' } },
  { id: 'ta', center: 'た', flicks: { left: 'ち', up: 'つ', right: 'て', down: 'と' } },
  { id: 'na', center: 'な', flicks: { left: 'に', up: 'ぬ', right: 'ね', down: 'の' } },
  { id: 'ha', center: 'は', flicks: { left: 'ひ', up: 'ふ', right: 'へ', down: 'ほ' } },
  { id: 'ma', center: 'ま', flicks: { left: 'み', up: 'む', right: 'め', down: 'も' } },
  { id: 'ya', center: 'や', flicks: { up: 'ゆ', down: 'よ' } },
  { id: 'ra', center: 'ら', flicks: { left: 'り', up: 'る', right: 'れ', down: 'ろ' } },
  { id: 'mod', center: '小゛゜', flicks: {}, isModifier: true },
  { id: 'wa', center: 'わ', flicks: { left: 'を', up: 'ん', right: 'ー' } },
  { id: 'mark', center: '、', flicks: { left: '。', up: '？', right: '！' } },
];

// 「小゛゜」キーで巡回する変換列。base -> [変換1, 変換2, ...]
// （baseを含めて先頭に戻るループ。例: は→ば→ぱ→は）
const FLICK_CYCLE = {
  'あ': ['ぁ'], 'い': ['ぃ'], 'う': ['ぅ'], 'え': ['ぇ'], 'お': ['ぉ'],
  'か': ['が'], 'き': ['ぎ'], 'く': ['ぐ'], 'け': ['げ'], 'こ': ['ご'],
  'さ': ['ざ'], 'し': ['じ'], 'す': ['ず'], 'せ': ['ぜ'], 'そ': ['ぞ'],
  'た': ['だ'], 'ち': ['ぢ'], 'つ': ['づ', 'っ'], 'て': ['で'], 'と': ['ど'],
  'は': ['ば', 'ぱ'], 'ひ': ['び', 'ぴ'], 'ふ': ['ぶ', 'ぷ'], 'へ': ['べ', 'ぺ'], 'ほ': ['ぼ', 'ぽ'],
  'や': ['ゃ'], 'ゆ': ['ゅ'], 'よ': ['ょ'],
  'わ': ['ゎ'],
};

// base -> [base, ...変換列] の完全な巡回シーケンス
const FLICK_SEQ = {};
// 任意の文字 -> そのbase
const FORM_TO_BASE = {};
for (const [base, forms] of Object.entries(FLICK_CYCLE)) {
  FLICK_SEQ[base] = [base, ...forms];
  for (const ch of FLICK_SEQ[base]) FORM_TO_BASE[ch] = base;
}

// 「小゛゜」キーを押したときの次の形。変換できない文字はそのまま返す。
function nextForm(ch) {
  const base = FORM_TO_BASE[ch];
  if (!base) return ch;
  const seq = FLICK_SEQ[base];
  return seq[(seq.indexOf(ch) + 1) % seq.length];
}

// 文字 -> { keyId, direction }（フリックの基本入力。baseのみ収録）
const CHAR_TO_FLICK = (() => {
  const map = {};
  for (const key of FLICK_KEYS) {
    if (key.center && !key.isModifier) map[key.center] = { keyId: key.id, direction: 'center' };
    for (const [dir, ch] of Object.entries(key.flicks)) {
      map[ch] = { keyId: key.id, direction: dir };
    }
  }
  return map;
})();

// 学習ガイド用: 目的の文字を打つためのキー・方向・「小゛゜」を押す回数
function flickGuideFor(char) {
  const base = FORM_TO_BASE[char];
  if (base && base !== char) {
    const info = CHAR_TO_FLICK[base];
    if (!info) return null;
    return { keyId: info.keyId, direction: info.direction, mods: FLICK_SEQ[base].indexOf(char) };
  }
  const info = CHAR_TO_FLICK[char];
  return info ? { keyId: info.keyId, direction: info.direction, mods: 0 } : null;
}

// ------------------------------------------------------------
// 1文字ぶんの入力判定。フリックの基本文字と「小゛゜」を受けて
// 'correct'（確定）/ 'pending'（変換待ち）/ 'wrong'（ミス）を返す。
// ------------------------------------------------------------
class CharMatcher {
  constructor(expected) {
    this.expected = expected;
    this.current = null; // 今キーから入った文字（変換途中を含む）
  }
  feedChar(ch) {
    this.current = ch;
    if (ch === this.expected) return 'correct';
    // expected が ch の濁点/小書き変化で到達できるなら変換待ち
    if (FLICK_SEQ[ch] && FLICK_SEQ[ch].includes(this.expected)) return 'pending';
    return 'wrong';
  }
  feedMod() {
    if (this.current == null) return 'wrong';
    this.current = nextForm(this.current);
    return this.current === this.expected ? 'correct' : 'pending';
  }
}

// ============================================================
// 練習用データ
// ============================================================

// 行（あ行・か行…）ごとのグループ。基礎練習モードで使用。
const KANA_GROUPS = {

const ALL_KANA = Object.values(KANA_GROUPS).flat();

// 難易度別の単語プール（濁点・小書きにも対応したので自然な語が使える）
const WORD_POOLS = {

    'ぎゅうにゅう', 'りょうり', 'きゅうしょく', 'ぱそこん', 'ちきゅう', 'しゃしん',

const WORDS = [...WORD_POOLS.easy, ...WORD_POOLS.normal]; // 旧ことばモード用


// WebAudio で効果音を合成（音声ファイル不要）。ミュート対応。
class SoundManager {
  constructor() {
    this.ctx = null;
    this.enabled = localStorage.getItem('flick_mute') !== '1';
  }
  _ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  setEnabled(on) {
    this.enabled = on;
    localStorage.setItem('flick_mute', on ? '0' : '1');
  }
  toggle() { this.setEnabled(!this.enabled); return this.enabled; }

  _tone(freq, dur, { type = 'sine', vol = 0.2, slide = 0, delay = 0 } = {}) {
    if (!this.enabled) return;
    const ctx = this._ensure();
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  tap()       { this._tone(440, 0.05, { type: 'triangle', vol: 0.12 }); }
  correct()   { this._tone(880, 0.07, { type: 'triangle', vol: 0.18, slide: 200 }); }
  combo(n)    { this._tone(660 + Math.min(n, 24) * 30, 0.08, { type: 'square', vol: 0.12 }); }
  wrong()     { this._tone(180, 0.16, { type: 'sawtooth', vol: 0.16, slide: -60 }); }
  hit()       { this._tone(520, 0.06, { type: 'square', vol: 0.14, slide: 120 }); }
  defeat()    { [523, 659, 784].forEach((f, i) => this._tone(f, 0.12, { type: 'triangle', vol: 0.18, delay: i * 0.06 })); }
  damage()    { this._tone(140, 0.22, { type: 'sawtooth', vol: 0.2, slide: -50 }); }
  levelup()   { [523, 659, 784, 1046].forEach((f, i) => this._tone(f, 0.18, { type: 'triangle', vol: 0.2, delay: i * 0.08 })); }
  clear()     { [659, 784, 988, 1318].forEach((f, i) => this._tone(f, 0.2, { type: 'triangle', vol: 0.2, delay: i * 0.1 })); }
  gameover()  { [392, 330, 262].forEach((f, i) => this._tone(f, 0.25, { type: 'triangle', vol: 0.18, delay: i * 0.14 })); }
  start()     { this._tone(660, 0.1, { type: 'triangle', vol: 0.16, slide: 200 }); }
}

const sound = new SoundManager();


// 進行データ・ハイスコアの保存（localStorage）
const Storage = {
  _key: 'flick_save_v1',

  load() {
    try {
      const raw = localStorage.getItem(this._key);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }

  },

  _default() {

// レベルに必要な累計XP（ゆるやかに増加）
function xpForLevel(level) {
  return Math.round(20 * Math.pow(level, 1.5));
}

// プレイヤーの強さ（レベル依存）
function playerStats(level) {
  return {
    maxHp: 40 + level * 12,
    attack: 6 + level * 2,        // 1文字あたりの基本ダメージ
  };
}


// フリックキーボード: 描画とジェスチャー検出
// 通常キー確定で onInput(char)、「小゛゜」キーで onModifier() を呼ぶ。

class FlickKeyboard {
  constructor(rootEl) {
    this.root = rootEl;
    this.onInput = () => {};
    this.onModifier = () => {};
    this.threshold = 26; // タップ/フリック判定の距離(px)
    this.keyEls = {};
    this.active = null;
    this.guide = null;
    this._build();
  }

  // 実機のかな入力配列（5列×4行）。中央3列が文字キー、左右が機能キー。
  // 機能キーは見た目だけ（反応しない）。'mod'(小゛゜)と文字キーのみ動作する。
  static LAYOUT = [
    ['next',  'a',   'ka', 'sa',   'del'],
    ['face',  'ta',  'na', 'ha',   'space'],
    ['abc',   'ma',  'ya', 'ra',   'enter'],
    ['globe', 'mod', 'wa', 'mark', 'enter'],
  ];
  static FN = {
    next:  { t: '次候補' },
    del:   { t: '⌫' },
    face:  { t: '☺' },
    space: { t: '空白' },
    abc:   { t: '英数' },
    globe: { t: '🌐' },
    enter: { t: '改行', enter: true },
  };

  _build() {
    this.root.innerHTML = '';
    this.root.classList.add('keyboard');
    const byId = {};
    for (const k of FLICK_KEYS) byId[k.id] = k;

    const placed = {};
    FlickKeyboard.LAYOUT.forEach((row, r) => {
      row.forEach((id, c) => {
        const key = byId[id];
        if (key) {
          const cell = this._makeKeyCell(key);
          cell.style.gridColumn = String(c + 1);
          cell.style.gridRow = String(r + 1);
          this.root.appendChild(cell);
          return;
        }
        const fn = FlickKeyboard.FN[id];
        if (!fn) return;
        if (fn.enter) {
          if (placed.enter) return;
          placed.enter = true;
        }
        const cell = document.createElement('div');
        cell.className = 'key key-fn' + (fn.enter ? ' key-enter' : '');
        cell.textContent = fn.t;
        cell.style.gridColumn = String(c + 1);
        cell.style.gridRow = fn.enter ? `${r + 1} / span 2` : String(r + 1);
        this.root.appendChild(cell);
      });
    });
  }

  _makeKeyCell(key) {
    const cell = document.createElement('div');
    cell.className = 'key';
    cell.dataset.keyId = key.id;
    if (key.isModifier) cell.classList.add('key-mod');

    const main = document.createElement('span');
    main.className = 'key-main';
    main.textContent = key.center;
    cell.appendChild(main);

    if (!key.isModifier) {
      const popup = document.createElement('div');
      popup.className = 'flick-popup';
      for (const dir of ['up', 'down', 'left', 'right', 'center']) {
        const ch = dir === 'center' ? key.center : key.flicks[dir];
        if (!ch) continue;
        const seg = document.createElement('span');
        seg.className = 'flick-seg flick-' + dir;
        seg.textContent = ch;
        seg.dataset.dir = dir;
        popup.appendChild(seg);
      }
      cell.appendChild(popup);
    }

    this.keyEls[key.id] = cell;
    this._bindPointer(cell, key);
    return cell;
  }

  _bindPointer(cell, key) {
    const start = (x, y) => {
      this.active = { key, startX: x, startY: y, dir: 'center' };
      cell.classList.add('pressed');
      if (!key.isModifier) this._updatePopup(cell, 'center');
    };
    const move = (x, y) => {
      if (!this.active || this.active.key !== key || key.isModifier) return;
      const dir = this._dirFor(x - this.active.startX, y - this.active.startY, key);
      this.active.dir = dir;
      this._updatePopup(cell, dir);
    };
    const end = () => {
      if (!this.active || this.active.key !== key) return;
      const dir = this.active.dir;
      cell.classList.remove('pressed');
      this._clearPopup(cell);
      this.active = null;
      if (key.isModifier) { this.onModifier(); return; }
      const ch = dir === 'center' ? key.center : key.flicks[dir];
      if (ch) this.onInput(ch);
    };
    const cancel = () => {
      cell.classList.remove('pressed');
      this._clearPopup(cell);
      this.active = null;
    };

    cell.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; start(t.clientX, t.clientY); }, { passive: false });
    cell.addEventListener('touchmove',  (e) => { e.preventDefault(); const t = e.changedTouches[0]; move(t.clientX, t.clientY); }, { passive: false });
    cell.addEventListener('touchend',   (e) => { e.preventDefault(); end(); }, { passive: false });
    cell.addEventListener('touchcancel', cancel);

    cell.addEventListener('mousedown', (e) => {
      e.preventDefault();
      start(e.clientX, e.clientY);
      const onMove = (ev) => move(ev.clientX, ev.clientY);
      const onUp = () => { end(); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
    });
  }

  _dirFor(dx, dy, key) {
    if (Math.hypot(dx, dy) < this.threshold) return 'center';
    let dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    return key.flicks[dir] ? dir : 'center';
  }

  _updatePopup(cell, dir) {
    cell.classList.add('show-popup');
    cell.querySelectorAll('.flick-seg').forEach((s) => s.classList.toggle('active', s.dataset.dir === dir));
  }
  _clearPopup(cell) {
    cell.classList.remove('show-popup');
    cell.querySelectorAll('.flick-seg').forEach((s) => s.classList.remove('active'));
  }

  // 次に打つ文字のキー・方向・「小゛゜」回数をハイライト（学習ガイド）
  setGuide(char) {
    this.clearGuide();
    if (!char) return;
    const g = flickGuideFor(char);
    if (!g) return;
    this.guide = g;
    const cell = this.keyEls[g.keyId];
    if (cell) { cell.classList.add('guide'); cell.dataset.guideDir = g.direction; }
    if (g.mods > 0) {
      const mod = this.keyEls['mod'];
      if (mod) { mod.classList.add('guide-mod'); mod.dataset.mods = g.mods; }
    }
  }
  clearGuide() {
    if (this.guide) {
      const cell = this.keyEls[this.guide.keyId];
      if (cell) { cell.classList.remove('guide'); delete cell.dataset.guideDir; }
      const mod = this.keyEls['mod'];
      if (mod) { mod.classList.remove('guide-mod'); delete mod.dataset.mods; }
      this.guide = null;
    }
  }

  flashWrong() {
    if (navigator.vibrate) navigator.vibrate(40);
    this.root.classList.remove('shake');
    void this.root.offsetWidth;
    this.root.classList.add('shake');
  }
}


// アーケード系モード: 基礎れんしゅう / ランダム / ことば / タイムアタック

const MODES = {
  basic: {
    label: '基礎れんしゅう', timed: false, needsGroup: true, guideDefault: true,
    makeQueue(opts) {
      const base = KANA_GROUPS[opts.group] || ALL_KANA;
      return shuffle([...base, ...base]).map((c) => ({ text: c }));
    },
  },
  random: {
    label: 'ランダム文字', timed: false, needsGroup: false, guideDefault: false,
    makeQueue() { return shuffle([...ALL_KANA]).slice(0, 20).map((c) => ({ text: c })); },
  },
  words: {
    label: 'ことば', timed: false, needsGroup: false, guideDefault: false,
    makeQueue() { return shuffle([...WORDS]).slice(0, 10).map((w) => ({ text: w })); },
  },
  timeattack: {
    label: 'タイムアタック', timed: true, duration: 60, needsGroup: false, guideDefault: false,
    makeQueue() { return shuffle([...WORDS, ...WORDS, ...WORDS]).map((w) => ({ text: w })); },
  },
};

class Game {
  constructor({ keyboard, ui }) {
    this.keyboard = keyboard;
    this.ui = ui;
    this.reset();
  }

  bind() {
    this.keyboard.onInput = (ch) => this.handleChar(ch);
    this.keyboard.onModifier = () => this.handleMod();
  }

  reset() {
    this.mode = null; this.queue = []; this.qIndex = 0; this.ci = 0;
    this.correct = 0; this.mistakes = 0; this.combo = 0; this.maxCombo = 0;
    this.score = 0; this.startTime = 0; this.running = false;
    this.showGuide = false; this.timerId = null; this.matcher = null;
  }

  start(modeKey, opts = {}) {
    this.reset();
    this.bind();
    this.modeKey = modeKey;
    this.mode = MODES[modeKey];
    this.queue = this.mode.makeQueue(opts);
    this.showGuide = opts.guide !== undefined ? opts.guide : this.mode.guideDefault;
    this.running = true;
    this.startTime = performance.now();
    sound.start();
    if (this.mode.timed) {
      this.remaining = this.mode.duration;
      this._tick();
      this.timerId = setInterval(() => this._tick(), 100);
    }
    this._renderPrompt();
    this.ui.updateStats(this.statsSnapshot());
  }

  _tick() {
    this.remaining = Math.max(0, this.mode.duration - (performance.now() - this.startTime) / 1000);
    this.ui.updateTimer(this.remaining);
    if (this.remaining <= 0) this.finish();
  }

  get prompt() { return this.queue[this.qIndex]; }
  get expected() { return this.prompt ? this.prompt.text[this.ci] : null; }

  _renderPrompt() {
    if (!this.prompt) { this.finish(); return; }
    this.matcher = new CharMatcher(this.expected);
    this.ui.showPrompt(this.prompt.text, this.ci);
    if (this.showGuide) this.keyboard.setGuide(this.expected);
    else this.keyboard.clearGuide();
  }

  _guideNext() {
    this.matcher = new CharMatcher(this.expected);
    if (this.showGuide) this.keyboard.setGuide(this.expected);
  }

  handleChar(ch) { if (this.running) { sound.tap(); this._apply(this.matcher.feedChar(ch)); } }
  handleMod()    { if (this.running) this._apply(this.matcher.feedMod()); }

  _apply(result) {
    if (result === 'correct') {
      this.correct++; this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      this.score += 10 + Math.min(this.combo, 20);
      sound.correct();
      if (this.combo > 1 && this.combo % 5 === 0) sound.combo(this.combo);
      this.ci++;
      this.ui.markCorrect(this.ci);
      if (this.ci >= this.prompt.text.length) {
        this.score += 20; this.qIndex++; this.ci = 0;
        if (this.mode.timed && this.qIndex >= this.queue.length - 2) {
          this.queue.push(...shuffle([...WORDS]).map((w) => ({ text: w })));
        }
        if (!this.mode.timed && this.qIndex >= this.queue.length) { this.finish(); return; }
        this._renderPrompt();
      } else {
        this._guideNext();
      }
    } else if (result === 'pending') {
      this.ui.markPending(this.ci, this.matcher.current);
    } else {
      this.mistakes++; this.combo = 0;
      this.keyboard.flashWrong(); this.ui.markWrong(); sound.wrong();
    }
    this.ui.updateStats(this.statsSnapshot());
  }

  statsSnapshot() {
    const elapsed = Math.max(0.001, (performance.now() - this.startTime) / 1000);
    const total = this.correct + this.mistakes;
    return {
      score: this.score, combo: this.combo, maxCombo: this.maxCombo,
      accuracy: total ? Math.round((this.correct / total) * 100) : 100,
      cpm: Math.round((this.correct / elapsed) * 60),
      correct: this.correct, mistakes: this.mistakes, elapsed,
    };
  }

  finish() {
    if (!this.running) return;
    this.running = false;
    if (this.timerId) clearInterval(this.timerId);
    this.keyboard.clearGuide();
    sound.clear();
    const stats = this.statsSnapshot();
    stats.modeLabel = this.mode.label;
    stats.rank = rankFor(stats);
    // ベストスコア保存
    const save = Storage.load();
    save.bestScores = save.bestScores || {};
    const prev = save.bestScores[this.modeKey] || 0;
    stats.best = Math.max(prev, stats.score);
    stats.isNew = stats.score >= stats.best && stats.score > prev;
    save.bestScores[this.modeKey] = stats.best;
    save.totalChars = (save.totalChars || 0) + this.correct;
    Storage.save(save);
    this.ui.showResult(stats);
  }

  toggleGuide() {
    this.showGuide = !this.showGuide;
    if (this.showGuide) this.keyboard.setGuide(this.expected);
    else this.keyboard.clearGuide();
    return this.showGuide;
  }

  quit() {
    this.running = false;
    if (this.timerId) clearInterval(this.timerId);
    this.keyboard.clearGuide();
  }
}

function rankFor(stats) {
  if (stats.accuracy >= 98 && stats.cpm >= 90) return 'S';
  const s = stats.accuracy * 0.6 + Math.min(stats.cpm, 120) * 0.6;
  if (s >= 110) return 'A';
  if (s >= 90) return 'B';
  if (s >= 70) return 'C';
  return 'D';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const CHEERS = ['いいかんじ！', 'その ちょうし！', 'つよい！', 'ナイス！', 'すごい！', 'やるね！'];

class RPG {
  constructor({ keyboard, ui }) {
    this.keyboard = keyboard;
    this.ui = ui;
    this.running = false;
    this.paused = false;
    this._loopBound = (ts) => this._loop(ts);
  }

  bind() {
    this.keyboard.onInput = (ch) => this.onChar(ch);
    this.keyboard.onModifier = () => this.onMod();
  }

  startStage(stageId) {
    this.stage = RPG_STAGES.find((s) => s.id === stageId);
    if (!this.stage) return;
    this.save = Storage.load();
    const st = playerStats(this.save.level);
    this.maxHp = st.maxHp;
    this.hp = st.maxHp;
    this.attack = st.attack;
    this.combo = 0;
    this.maxCombo = 0;
    this.gainedXp = 0;
    this.gainedCoins = 0;
    this.queue = [...this.stage.monsters, { ...this.stage.boss, isBoss: true }];
    this.monsterIndex = 0;
    this.totalMonsters = this.queue.length;

    this.bind();
    this.ui.rpgSetup(this.stage, this.save.level, this.hp, this.maxHp);
    this._spawnMonster();

    this.running = true;
    this.paused = false;
    this._last = performance.now();
    requestAnimationFrame(this._loopBound);
  }

  _spawnMonster() {
    this.monster = this.queue[this.monsterIndex];
    this.monsterHp = this.monster.hp;
    this.atkGauge = 0;
    this.ui.showMonster(this.monster, this.monsterIndex + 1, this.totalMonsters);
    this.ui.setMonsterHp(1);
    this.ui.setAtkGauge(0);
    this._nextWord();
  }

  _nextWord() {
    const pool = WORD_POOLS[this.stage.tier] || WORD_POOLS.easy;
    this.word = pool[Math.floor(Math.random() * pool.length)];
    this.ci = 0;
    this.matcher = new CharMatcher(this.word[0]);
    this.ui.showWord(this.word, 0);
  }

  // ---- 入力処理 ----
  onChar(ch) {
    if (!this.running || this.paused) return;
    sound.tap();
    this._apply(this.matcher.feedChar(ch));
  }
  onMod() {
    if (!this.running || this.paused) return;
    this._apply(this.matcher.feedMod());
  }
  _apply(result) {
    if (result === 'correct') {
      this.combo++;
      this.maxCombo = Math.max(this.maxCombo, this.combo);
      this.save.totalChars++;
      const dmg = this.attack + Math.floor(this.combo / 3) * 2;
      this._damageMonster(dmg);
      this.ui.wordAdvance(this.ci);
      sound.correct();
      this.ci++;
      if (this.ci >= this.word.length) {
        this._nextWord();
      } else {
        this.matcher = new CharMatcher(this.word[this.ci]);
        this.ui.guideChar(this.word[this.ci]);
      }
    } else if (result === 'pending') {
      this.ui.wordPending(this.ci, this.matcher.current);
    } else {
      this.combo = 0;
      this.ui.wordWrong();
      this.keyboard.flashWrong();
      sound.wrong();
    }
  }

  _damageMonster(dmg) {
    if (!this.monster) return;
    this.monsterHp -= dmg;
    const crit = this.combo >= 10 && this.combo % 5 === 0;
    this.ui.damageMonster(crit ? dmg * 2 : dmg, crit);
    if (crit) this.monsterHp -= dmg; // クリティカル追加
    sound.hit();
    this.ui.setMonsterHp(Math.max(0, this.monsterHp) / this.monster.hp);
    if (this.monsterHp <= 0) this._defeatMonster();
  }

  _defeatMonster() {
    const m = this.monster;
    const xp = Math.round(m.hp / 3) + (m.isBoss ? 30 : 0);
    const coins = Math.round(m.hp / 8) + (m.isBoss ? 20 : 0);
    this.gainedXp += xp;
    this.gainedCoins += coins;
    this.monster = null;
    sound.defeat();
    this.ui.monsterDefeated(xp);
    this.ui.mascotSay(CHEERS[Math.floor(Math.random() * CHEERS.length)], 'happy');

    this.paused = true;
    setTimeout(() => {
      this.monsterIndex++;
      if (this.monsterIndex >= this.queue.length) {
        this._stageClear();
      } else {
        this.paused = false;
        this._spawnMonster();
      }
    }, 900);
  }

  // ---- 敵の攻撃ループ ----
  _loop(ts) {
    if (!this.running) return;
    const dt = (ts - this._last) / 1000;
    this._last = ts;
    if (!this.paused && this.monster) {
      this.atkGauge += dt;
      this.ui.setAtkGauge(Math.min(1, this.atkGauge / this.monster.interval));
      if (this.atkGauge >= this.monster.interval) {
        this.atkGauge = 0;
        this._monsterAttack();
      }
    }
    requestAnimationFrame(this._loopBound);
  }

  _monsterAttack() {
    this.hp -= this.monster.atk;
    this.combo = 0;
    sound.damage();
    this.ui.playerHurt(this.monster.atk, this.hp, this.maxHp);
    if (this.hp <= 0) {
      this.hp = 0;
      this.ui.setPlayerHp(0, this.maxHp);
      this._gameOver();
    }
  }

  // ---- 終了処理 ----
  _applyRewards() {
    this.save.xp += this.gainedXp;
    this.save.coins += this.gainedCoins;
    let leveled = 0;
    while (this.save.xp >= xpForLevel(this.save.level)) {
      this.save.xp -= xpForLevel(this.save.level);
      this.save.level++;
      leveled++;
    }
    Storage.save(this.save);
    return leveled;
  }

  _stageClear() {
    this.running = false;
    if (!this.save.clearedStages.includes(this.stage.id)) {
      this.save.clearedStages.push(this.stage.id);
    }
    const leveled = this._applyRewards();
    sound.clear();
    if (leveled) sound.levelup();
    this.ui.stageClear({
      stage: this.stage,
      xp: this.gainedXp,
      coins: this.gainedCoins,
      leveled,
      level: this.save.level,
      maxCombo: this.maxCombo,
      nextUnlocked: RPG_STAGES.some((s) => s.id === this.stage.id + 1),
    });
  }

  _gameOver() {
    this.running = false;
    // 倒したぶんの報酬は獲得（がんばりを無駄にしない）
    const leveled = this._applyRewards();
    sound.gameover();
    this.ui.rpgGameOver({
      stage: this.stage,
      xp: this.gainedXp,
      coins: this.gainedCoins,
      leveled,
      level: this.save.level,
    });
  }

  quit() {
    this.running = false;
    this.paused = false;
    this.keyboard.clearGuide();
  }
}

  container.innerHTML = '';

    const span = document.createElement('span');
    span.className = 'ch' + (i < charIndex ? ' done' : i === charIndex ? ' cur' : '');
    span.textContent = text[i];
    container.appendChild(span);
  }
}

  rpgGameOver(r) {
    showResultScreen({
      title: 'やられた…', mood: 'hurt', isNew: false, leveled: r.leveled, level: r.level,
      grid: [['もらったXP', '+' + r.xp], ['コイン', '🪙 +' + r.coins]],
      note: 'レベルを あげて さいちょうせん！',
      again: () => startStage(currentStageId),
      againLabel: 'リトライ',
    });
  },
};

function spawnPopup(layer, text, cls) {
  const el = document.createElement('div');
  el.className = 'popup ' + cls;
  el.textContent = text;
  el.style.left = (30 + Math.random() * 40) + '%';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

// ===========================================================
// 結果画面（共通）
// ===========================================================
function showResultScreen(cfg) {
  document.getElementById('result-title').textContent = cfg.title;
  const rankEl = document.getElementById('result-rank');
  if (cfg.rank) { rankEl.hidden = false; rankEl.textContent = cfg.rank; rankEl.dataset.rank = cfg.rank; }
  else rankEl.hidden = true;
  document.getElementById('result-new').hidden = !cfg.isNew;
  const lvl = document.getElementById('result-levelup');
  if (cfg.leveled) { lvl.hidden = false; document.getElementById('result-newlevel').textContent = cfg.level; }
  else lvl.hidden = true;

  const grid = document.getElementById('result-grid');
  grid.innerHTML = '';
  for (const [k, v] of cfg.grid) {
    const d = document.createElement('div');
    d.className = 'rstat';
    d.innerHTML = `<span>${k}</span><b>${v}</b>`;
    grid.appendChild(d);
  }
  let note = document.getElementById('result-note');
  if (cfg.note) {
    if (!note) { note = document.createElement('p'); note.id = 'result-note'; note.className = 'result-note'; grid.after(note); }
    note.textContent = cfg.note; note.hidden = false;
  } else if (note) note.hidden = true;

  setMood('.mascot-result', cfg.mood || 'happy');
  const againBtn = document.getElementById('result-again');
  againBtn.textContent = cfg.againLabel || 'もういちど';
  againBtn.onclick = cfg.again;
  showScreen('result');
}

// ===========================================================
// インスタンスと起動フロー
// ===========================================================
const game = new Game({ keyboard, ui: arcadeUI });
const rpg = new RPG({ keyboard, ui: rpgUI });

let lastArcadeOpts = {};
let pendingMode = null;
let currentStageId = 1;
let rpgGuideOn = true;

function startArcade(modeKey, opts) {
  lastArcadeOpts = opts;
  const mode = MODES[modeKey];
  document.getElementById('play-mode-label').textContent = mode.label;
  document.getElementById('timer-wrap').hidden = !mode.timed;
  mountKeyboard('play-kb');
  showScreen('play');
  game.start(modeKey, opts);
  els.guideBtn.classList.toggle('on', game.showGuide);
}

function startStage(stageId) {
  currentStageId = stageId;
  mountKeyboard('rpg-kb');
  showScreen('rpg');
  rpg.startStage(stageId);
}

// ---- ステージ一覧 ----
function showStages() {
  const s = Storage.load();
  document.getElementById('stages-level').textContent = s.level;
  const list = document.getElementById('stage-list');
  list.innerHTML = '';
  RPG_STAGES.forEach((stage, i) => {
    const cleared = s.clearedStages.includes(stage.id);
    const unlocked = i === 0 || s.clearedStages.includes(RPG_STAGES[i - 1].id);
    const btn = document.createElement('button');
    btn.className = 'btn stage-card ' + stage.bg + (unlocked ? '' : ' locked');
    btn.innerHTML = `
      <span class="stage-num">${stage.id}</span>
      <span class="stage-info"><b>${stage.name}</b>
        <small>${unlocked ? (cleared ? '✅ クリアずみ' : 'ボス：' + stage.boss.name) : '🔒 まだ あけられない'}</small></span>
      <span class="stage-go">${unlocked ? '▶' : '🔒'}</span>`;
    if (unlocked) btn.addEventListener('click', () => startStage(stage.id));
    list.appendChild(btn);
  });
  showScreen('stages');
}

// ---- 行選択(きそ) ----
const groupGrid = document.getElementById('group-grid');
Object.entries(GROUP_LABELS).forEach(([key, label]) => {
  const btn = document.createElement('button');
  btn.className = 'btn group-btn';
  btn.textContent = label;
  btn.addEventListener('click', () => startArcade('basic', { group: key }));
  groupGrid.appendChild(btn);
});
document.getElementById('group-all').addEventListener('click', () => startArcade('basic', { group: null }));

// ---- イベントバインド ----
document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
  const m = b.dataset.mode;
  if (MODES[m].needsGroup) { pendingMode = m; showScreen('group'); }
  else startArcade(m, {});
}));
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => {
  const dest = b.dataset.go;
  game.quit(); rpg.quit();
  if (dest === 'home') { refreshHome(); showScreen('home'); }
  else if (dest === 'stages') showStages();
}));
els.guideBtn.addEventListener('click', () => els.guideBtn.classList.toggle('on', game.toggleGuide()));

// ミュート
const muteBtn = document.getElementById('mute-btn');
function refreshMute() { muteBtn.textContent = sound.enabled ? '🔊' : '🔇'; }
muteBtn.addEventListener('click', () => { sound.toggle(); refreshMute(); });
refreshMute();

// 起動
refreshHome();
showScreen('home');

</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
